
name: Nightly

on:
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    nightly:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Get Go
              uses: actions/setup-go@v5
              with:
                  go-version: stable

            - name: Build
              run: |
                  mkdir -p dist

                  GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
                    go build -trimpath -ldflags="-s -w" \
                    -o dist/mkimg-windows-amd64.exe .

                  GOOS=windows GOARCH=arm64 CGO_ENABLED=0 \
                    go build -trimpath -ldflags="-s -w" \
                    -o dist/mkimg-windows-arm64.exe .

                  GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
                    go build -trimpath -ldflags="-s -w" \
                    -o dist/mkimg-linux-amd64 .

                  GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
                    go build -trimpath -ldflags="-s -w" \
                    -o dist/mkimg-linux-arm64 .

                  GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 \
                    go build -trimpath -ldflags="-s -w" \
                    -o dist/mkimg-macos-amd64 .

                  GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 \
                    go build -trimpath -ldflags="-s -w" \
                    -o dist/mkimg-macos-arm64 .

            - name: Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  tag="$(date -u +%d_%m_%Y)"

                  gh release create "$tag" dist/* \
                    --title "$(date -u +%d/%m/%Y)" \
                    --target "$GITHUB_SHA" \
                    --prerelease \
                    --latest=false \
                    --notes "Automated Go build from commit $GITHUB_SHA."
